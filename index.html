<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>Borne de commande</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800;900&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root{
      --mcdo-green: #2A7A3A;
      --mcdo-green-dark: #1D5E2A;
      --mcdo-yellow: #FFC72C;
      --paper: #F4F9F5;
      --paper-2: #E5F0E8;
      --line: #C8DBCE;
      --gray: #5A6F5E;
      --ink: #1A2B1C;
    }
    *{box-sizing:border-box;margin:0;padding:0;}
    html,body{height:100%;}
    body{font-family:'Inter',Arial,sans-serif;background:#1e2a20;color:var(--ink);}
    .kiosk{width:100vw;height:100vh;background:var(--paper);display:flex;flex-direction:column;overflow:hidden;}
    .kiosk-screen{flex:1;display:flex;flex-direction:column;overflow:hidden;}

    .app-header{background:var(--mcdo-green);color:#fff;padding:12px 20px;display:flex;align-items:center;gap:12px;flex-shrink:0;z-index:10;}
    .app-header .title{font-weight:800;font-size:18px;}
    .app-header .order-type{background:rgba(255,255,255,.16);border:none;color:#fff;font-size:11px;font-weight:700;padding:6px 12px;border-radius:999px;cursor:pointer;}
    .header-spacer{flex:1;}
    .cart-btn{background:var(--mcdo-yellow);border:none;width:40px;height:40px;border-radius:50%;font-size:18px;cursor:pointer;position:relative;display:flex;align-items:center;justify-content:center;}
    .cart-btn .badge{position:absolute;top:-4px;right:-4px;background:var(--ink);color:#fff;font-size:10px;font-weight:800;min-width:18px;height:18px;border-radius:9px;display:flex;align-items:center;justify-content:center;padding:0 4px;border:2px solid var(--mcdo-green);}

    .categories{display:flex;gap:8px;padding:10px 16px;background:#fff;border-bottom:1px solid var(--line);overflow-x:auto;flex-shrink:0;scrollbar-width:none;}
    .categories::-webkit-scrollbar{display:none;}
    .cat-btn{border:none;background:var(--paper-2);color:var(--ink);font-weight:700;font-size:12px;padding:8px 16px;border-radius:999px;cursor:pointer;white-space:nowrap;display:flex;align-items:center;gap:6px;}
    .cat-btn.active{background:var(--mcdo-green);color:#fff;}

    #catalog{flex:1;overflow-y:auto;padding:14px 16px 100px;display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;align-content:start;}
    .card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px;cursor:pointer;display:flex;flex-direction:column;position:relative;}
    .card:active{transform:scale(.96);}
    .card .emoji{font-size:42px;text-align:center;padding:8px 0;background:var(--paper-2);border-radius:12px;margin-bottom:8px;}
    .card .name{font-weight:700;font-size:13px;}
    .card .price{font-weight:800;color:var(--mcdo-green-dark);font-size:14px;margin-top:4px;}
    .card .tag{position:absolute;top:6px;left:6px;background:var(--mcdo-green);color:#fff;font-size:8px;font-weight:800;padding:2px 8px;border-radius:999px;}
    .card .add-btn{background:var(--mcdo-yellow);border:none;width:28px;height:28px;border-radius:50%;font-size:16px;font-weight:800;cursor:pointer;float:right;margin-top:-6px;}

    #cartbar{position:fixed;bottom:16px;left:16px;right:16px;background:var(--mcdo-green);color:#fff;border-radius:16px;padding:14px 20px;display:none;align-items:center;justify-content:space-between;cursor:pointer;z-index:20;box-shadow:0 8px 24px rgba(42,122,58,.4);}
    #cartbar.show{display:flex;}
    #cartbar .left{display:flex;align-items:center;gap:10px;font-weight:700;font-size:13px;}
    #cartbar .left .circle{background:var(--mcdo-yellow);color:var(--ink);width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;}
    #cartbar .right{font-weight:800;font-size:15px;}

    #overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:flex-end;z-index:30;}
    #overlay.show{display:flex;}
    #modal{background:#fff;border-radius:24px 24px 0 0;width:100%;max-height:85%;overflow-y:auto;padding:20px 24px 24px;}
    #modal-close{float:right;background:var(--paper-2);border:none;width:32px;height:32px;border-radius:50%;font-size:16px;cursor:pointer;}
    .modal-emoji{font-size:56px;text-align:center;margin:4px 0 8px;}
    #modal h3{text-align:center;font-size:18px;}
    .m-desc{text-align:center;color:var(--gray);font-size:12px;margin-bottom:12px;}
    .option-group{margin:12px 0;}
    .option-group .group-label{font-weight:800;color:var(--mcdo-green-dark);font-size:11px;text-transform:uppercase;display:block;margin-bottom:6px;}
    .opt{display:flex;justify-content:space-between;padding:10px 14px;border:1.5px solid var(--line);border-radius:12px;margin-bottom:6px;cursor:pointer;}
    .opt.selected{border-color:var(--mcdo-green);background:#EAF5EE;}
    .opt .opt-emoji{font-size:20px;margin-right:8px;}
    #modal-add-btn{width:100%;background:var(--mcdo-yellow);border:none;padding:14px;border-radius:14px;font-weight:800;font-size:15px;cursor:pointer;margin-top:8px;}

    #drawer-scrim{position:fixed;inset:0;background:rgba(0,0,0,.4);opacity:0;pointer-events:none;transition:opacity .25s;z-index:25;}
    #drawer-scrim.show{opacity:1;pointer-events:auto;}
    #drawer{position:fixed;bottom:0;left:0;right:0;height:88%;background:#fff;border-radius:24px 24px 0 0;transform:translateY(100%);transition:transform .3s;z-index:26;display:flex;flex-direction:column;box-shadow:0 -10px 30px rgba(0,0,0,.15);}
    #drawer.open{transform:translateY(0);}
    .drawer-handle{width:40px;height:4px;background:var(--line);border-radius:3px;margin:12px auto 4px;flex-shrink:0;}
    .drawer-head{padding:8px 20px 14px;display:flex;justify-content:space-between;border-bottom:1px solid var(--line);flex-shrink:0;}
    .drawer-head h2{font-size:17px;}
    #drawer-close{background:var(--paper-2);border:none;width:30px;height:30px;border-radius:50%;font-size:14px;cursor:pointer;}
    #drawer-items{flex:1;overflow-y:auto;padding:8px 20px;}
    .empty-cart{text-align:center;color:var(--gray);padding:60px 20px;}
    .empty-cart .big{font-size:48px;display:block;margin-bottom:10px;}
    .cart-item{display:flex;gap:12px;padding:12px 0;border-bottom:1px dashed var(--line);}
    .cart-item .ci-emoji{width:40px;height:40px;border-radius:12px;background:var(--paper-2);display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0;}
    .cart-item .info{flex:1;}
    .cart-item .info .name{font-weight:700;font-size:13px;}
    .cart-item .line-bottom{display:flex;align-items:center;justify-content:space-between;margin-top:6px;}
    .qty-ctrl{display:flex;align-items:center;gap:8px;background:var(--paper-2);border-radius:999px;padding:2px 4px;}
    .qty-ctrl button{width:22px;height:22px;border:none;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.1);font-weight:800;cursor:pointer;font-size:13px;}
    .qty-ctrl span{font-size:13px;font-weight:700;min-width:16px;text-align:center;}
    .item-price{font-weight:800;font-size:13px;color:var(--mcdo-green-dark);}
    .remove-btn{background:none;border:none;color:var(--gray);font-size:10px;text-decoration:underline;cursor:pointer;margin-top:2px;}
    #drawer-footer{flex-shrink:0;padding:12px 20px 20px;border-top:1px solid var(--line);}
    .totals-row{display:flex;justify-content:space-between;font-size:12px;color:var(--gray);margin-bottom:4px;}
    .totals-row.total{font-size:18px;font-weight:800;color:var(--ink);margin:8px 0 12px;}
    #drawer-checkout{width:100%;background:var(--mcdo-green);color:#fff;border:none;padding:14px;border-radius:14px;font-weight:800;font-size:15px;cursor:pointer;}
    #drawer-checkout:disabled{background:#d0e0d2;color:#8a9a8a;cursor:not-allowed;}
    #drawer-continue{width:100%;background:none;border:none;color:var(--gray);font-size:11px;margin-top:8px;cursor:pointer;text-decoration:underline;}

    #screen-confirm{position:fixed;inset:0;background:var(--mcdo-green);display:none;flex-direction:column;align-items:center;justify-content:center;padding:20px;z-index:40;}
    #screen-confirm.show{display:flex;}
    #screen-confirm .check{width:70px;height:70px;border-radius:50%;background:var(--mcdo-yellow);display:flex;align-items:center;justify-content:center;font-size:32px;color:var(--mcdo-green);margin-bottom:10px;}
    #screen-confirm h1{color:#fff;font-size:20px;}
    #screen-confirm p{color:rgba(255,255,255,.85);font-size:13px;margin-bottom:12px;text-align:center;}
    .receipt{background:#fffdf8;width:100%;max-width:340px;border-radius:10px;padding:16px;max-height:45vh;overflow-y:auto;font-size:12px;}
    .receipt .r-title{text-align:center;font-weight:800;font-size:14px;}
    .receipt .r-num{text-align:center;font-size:28px;font-weight:900;border-top:1px dashed var(--line);border-bottom:1px dashed var(--line);padding:6px 0;margin:6px 0;color:var(--mcdo-green-dark);}
    .receipt .r-line{display:flex;justify-content:space-between;padding:2px 0;}
    .receipt .r-total{display:flex;justify-content:space-between;font-weight:800;font-size:14px;border-top:1px dashed var(--line);margin-top:8px;padding-top:8px;}
    .receipt .r-type{text-align:center;font-size:10px;color:var(--gray);margin-top:6px;}
    #confirm-new-btn{margin-top:16px;background:#fff;color:var(--mcdo-green);border:none;padding:12px 32px;border-radius:999px;font-weight:800;font-size:14px;cursor:pointer;}
    #json-status{color:#fff;font-size:12px;margin-top:8px;opacity:.8;text-align:center;}

    #screen-welcome{position:fixed;inset:0;background:linear-gradient(165deg,var(--mcdo-green),#155020);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px;z-index:50;}
    #screen-welcome .logo{font-size:72px;margin-bottom:8px;}
    #screen-welcome h1{font-size:26px;}
    #screen-welcome p{opacity:.9;max-width:300px;font-size:14px;margin:4px 0 20px;}
    #screen-welcome .choices{width:100%;max-width:340px;display:flex;flex-direction:column;gap:12px;}
    #screen-welcome .choice-btn{background:#fff;color:var(--ink);border:none;border-radius:16px;padding:16px 20px;font-weight:800;font-size:15px;display:flex;align-items:center;gap:14px;cursor:pointer;box-shadow:0 4px 16px rgba(0,0,0,.15);}
    #screen-welcome .choice-btn .ico{font-size:28px;}
    #screen-welcome .choice-btn small{display:block;font-weight:500;font-size:11px;color:var(--gray);}

    ::-webkit-scrollbar{width:5px;}
    ::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px;}
  </style>
</head>
<body>

<div class="kiosk">
  <div class="kiosk-screen">
    <div id="app">

      <header class="app-header">
        <span class="title">🍔 McBORNE</span>
        <button class="order-type" id="order-type-btn">🍽️ Sur place</button>
        <div class="header-spacer"></div>
        <button class="cart-btn" id="cart-btn">🛒<span class="badge" id="cart-badge">0</span></button>
      </header>

      <nav class="categories" id="categories"></nav>
      <div id="catalog"></div>

      <div id="cartbar">
        <div class="left"><span class="circle" id="cartbar-count">0</span> <span id="cartbar-label">articles</span></div>
        <div class="right"><span id="cartbar-total">0,00 €</span> ›</div>
      </div>

      <div id="screen-welcome">
        <div class="logo">🍔</div>
        <h1>Bienvenue</h1>
        <p>Composez votre commande</p>
        <div class="choices">
          <button class="choice-btn" data-type="sur_place"><span class="ico">🍽️</span><span>Sur place<small>Je mange au restaurant</small></span></button>
          <button class="choice-btn" data-type="emporter"><span class="ico">🥡</span><span>À emporter<small>Je pars avec ma commande</small></span></button>
        </div>
      </div>

      <div id="overlay">
        <div id="modal">
          <button id="modal-close">✕</button>
          <div id="modal-body"></div>
        </div>
      </div>

      <div id="drawer-scrim"></div>
      <div id="drawer">
        <div class="drawer-handle"></div>
        <div class="drawer-head"><h2>🧾 Mon panier</h2><button id="drawer-close">✕</button></div>
        <div id="drawer-items"></div>
        <div id="drawer-footer">
          <div class="totals-row"><span>Sous-total</span><span id="sub-total">0,00 €</span></div>
          <div class="totals-row total"><span>Total</span><span id="grand-total">0,00 €</span></div>
          <button id="drawer-checkout" disabled>✅ Valider la commande</button>
          <button id="drawer-continue">Continuer mes achats</button>
        </div>
      </div>

      <div id="screen-confirm">
        <div class="check">✓</div>
        <h1>Commande validée !</h1>
        <p>Votre commande a été enregistrée</p>
        <div class="receipt" id="receipt"></div>
        <div id="json-status">📄 Fichier commande.json mis à jour</div>
        <button id="confirm-new-btn">Nouvelle commande</button>
      </div>

    </div>
  </div>
</div>

<script>
// ==================== DONNÉES ====================
const MENU_DATA = {
  burgers: [
    {id:'hamburger', name:'Hamburger', price:1.90, emoji:'🍔'},
    {id:'cheeseburger', name:'Cheeseburger', price:2.30, emoji:'🧀'},
    {id:'double_cheese', name:'Double Cheeseburger', price:3.60, emoji:'🍔🍔'},
    {id:'bigmac', name:'Big Mac', price:5.90, emoji:'👑'}
  ],
  nuggets: [
    {id:'nuggets4', name:'4 Nuggets', price:2.90, emoji:'🍗'},
    {id:'nuggets6', name:'6 Nuggets', price:4.10, emoji:'🍗'},
    {id:'nuggets9', name:'9 Nuggets', price:5.50, emoji:'🍗'}
  ],
  frites: [
    {id:'frites_p', name:'Petite frite', price:1.80, emoji:'🍟'},
    {id:'frites_m', name:'Moyenne frite', price:2.40, emoji:'🍟'},
    {id:'frites_g', name:'Grande frite', price:3.00, emoji:'🍟'}
  ],
  boissons: [
    {id:'jus_pomme', name:'Jus de pomme', price:1.50, emoji:'🧃'},
    {id:'coca', name:'Coca-Cola', price:1.50, emoji:'🥤'},
    {id:'ice_tea', name:'Ice Tea', price:1.55, emoji:'🧊'},
    {id:'eau_gazeuse', name:'Eau gazeuse', price:1.50, emoji:'💧'},
    {id:'eau', name:'Eau plate', price:1.50, emoji:'💧'}
  ],
  menus: [
    {id:'best_of', name:'Menu Best Of', price:7.90, emoji:'🍽️', tag:'MENU', wizard:true},
    {id:'maxi_best_of', name:'Menu Maxi Best Of', price:9.90, emoji:'🍽️', tag:'MENU', wizard:true},
    {id:'happy_meal', name:'Happy Meal', price:5.50, emoji:'🎁', tag:'MENU', wizard:true}
  ]
};

const CATEGORIES = [
  {id:'menus', name:'Menus', emoji:'🍽️'},
  {id:'burgers', name:'Burgers', emoji:'🍔'},
  {id:'nuggets', name:'Nuggets', emoji:'🍗'},
  {id:'frites', name:'Frites', emoji:'🍟'},
  {id:'boissons', name:'Boissons', emoji:'🥤'}
];

// ==================== ÉTAT ====================
let currentCat = 'menus';
let cart = [];
let orderType = 'sur_place';

// ==================== RENDER CATALOG ====================
function renderCatalog() {
  const items = MENU_DATA[currentCat] || [];
  const el = document.getElementById('catalog');
  el.innerHTML = items.map(p => `
    <div class="card" data-id="${p.id}">
      ${p.tag ? `<span class="tag">${p.tag}</span>` : ''}
      <div class="emoji">${p.emoji || '🍔'}</div>
      <div class="name">${p.name}</div>
      <div class="price">${fmt(p.price)}</div>
      <button class="add-btn" onclick="event.stopPropagation(); openProduct('${currentCat}','${p.id}')">+</button>
    </div>
  `).join('');
}

function renderCategories() {
  const el = document.getElementById('categories');
  el.innerHTML = CATEGORIES.map(c => `
    <button class="cat-btn ${c.id === currentCat ? 'active' : ''}" onclick="switchCategory('${c.id}')">
      ${c.emoji} ${c.name}
    </button>
  `).join('');
}

function switchCategory(id) {
  currentCat = id;
  renderCategories();
  renderCatalog();
}

// ==================== OUVERTURE PRODUIT ====================
function openProduct(cat, id) {
  const p = MENU_DATA[cat].find(x => x.id === id);
  if (!p) return;
  if (p.wizard) { openWizard(p); return; }
  addToCart(p);
}

// ==================== WIZARD ====================
let wizardSteps = [];
let wizardIndex = 0;
let wizardChoices = {};
let wizardMenu = null;

function openWizard(menu) {
  wizardMenu = menu;
  wizardSteps = [];
  wizardIndex = 0;
  wizardChoices = {};
  
  let platOptions = [
    {id:'hamburger', name:'Hamburger', price:0, emoji:'🍔'},
    {id:'cheeseburger', name:'Cheeseburger', price:0.40, emoji:'🧀'},
    {id:'double_cheese', name:'Double Cheeseburger', price:1.70, emoji:'🍔🍔'},
    {id:'bigmac', name:'Big Mac', price:2.40, emoji:'👑'}
  ];
  if (menu.id === 'happy_meal') {
    platOptions = [
      {id:'hamburger', name:'Hamburger', price:0, emoji:'🍔'},
      {id:'nuggets4', name:'4 Nuggets', price:0, emoji:'🍗'}
    ];
  }
  wizardSteps.push({title:'Choisissez votre plat', options:platOptions, key:'plat'});
  
  let friesOpts = [
    {id:'p', name:'Petite frite', price:0, emoji:'🍟'},
    {id:'m', name:'Moyenne frite', price:0.60, emoji:'🍟'},
    {id:'g', name:'Grande frite', price:1.20, emoji:'🍟'}
  ];
  if (menu.id === 'happy_meal') friesOpts = [{id:'p', name:'Petite frite', price:0, emoji:'🍟'}];
  if (menu.id === 'maxi_best_of') {
    friesOpts = [
      {id:'p', name:'Petite frite', price:-1.20, emoji:'🍟'},
      {id:'m', name:'Moyenne frite', price:-0.60, emoji:'🍟'},
      {id:'g', name:'Grande frite', price:0, emoji:'🍟'}
    ];
  }
  wizardSteps.push({title:'Choisissez vos frites', options:friesOpts, key:'frites'});
  
  wizardSteps.push({
    title:'Choisissez votre sauce',
    options:[
      {id:'mayo', name:'Mayonnaise', price:0, emoji:'🥫'},
      {id:'ketchup', name:'Ketchup', price:0, emoji:'🥫'}
    ],
    key:'sauce'
  });
  
  wizardSteps.push({
    title:'Choisissez votre boisson',
    options:MENU_DATA.boissons.map(b => ({id:b.id, name:b.name, price:0, emoji:b.emoji})),
    key:'boisson'
  });
  
  const extras = [
    {id:'extra_nuggets', name:'4 Nuggets en plus', price:2.90, emoji:'🍗'},
    {id:'extra_burger', name:'Hamburger en plus', price:1.90, emoji:'🍔'}
  ];
  if (menu.id === 'happy_meal') extras.pop();
  wizardSteps.push({
    title:'Un petit plus ? (facultatif)',
    options:extras,
    key:'extra',
    extras:true
  });
  
  renderWizard();
  document.getElementById('overlay').classList.add('show');
}

function renderWizard() {
  const step = wizardSteps[wizardIndex];
  const body = document.getElementById('modal-body');
  const isExtra = step.extras || false;
  let total = computeWizardTotal();
  
  let html = `<div class="modal-emoji">${step.options[0]?.emoji || '🍽️'}</div>`;
  html += `<h3>${step.title}</h3>`;
  html += `<div style="text-align:center;font-size:12px;color:var(--gray);margin-bottom:12px;">Étape ${wizardIndex+1}/${wizardSteps.length}</div>`;
  
  if (isExtra) {
    html += step.options.map(o => `
      <div class="opt ${wizardChoices[o.id] ? 'selected' : ''}" onclick="toggleExtra('${o.id}')">
        <span><span class="opt-emoji">${o.emoji}</span> ${o.name}</span>
        <span style="color:var(--gray);font-size:12px;">+${fmt(o.price)}</span>
      </div>
    `).join('');
  } else {
    html += step.options.map(o => `
      <div class="opt ${wizardChoices[step.key] === o.id ? 'selected' : ''}" onclick="selectWizard('${step.key}','${o.id}')">
        <span><span class="opt-emoji">${o.emoji}</span> ${o.name}</span>
        <span style="color:var(--gray);font-size:12px;">${o.price > 0 ? '+'+fmt(o.price) : o.price < 0 ? fmt(o.price) : 'Inclus'}</span>
      </div>
    `).join('');
  }
  
  const hasSelection = isExtra ? true : wizardChoices[step.key] !== undefined;
  const isLast = wizardIndex === wizardSteps.length - 1;
  
  html += `<div style="display:flex;gap:10px;margin-top:14px;flex-wrap:wrap;">`;
  if (wizardIndex > 0) {
    html += `<button onclick="wizardPrev()" style="flex:1;padding:12px;border-radius:12px;border:1px solid var(--line);background:#fff;cursor:pointer;font-weight:700;">Retour</button>`;
  }
  if (!isLast) {
    html += `<button ${!hasSelection ? 'disabled' : ''} onclick="wizardNext()" style="flex:2;padding:12px;border-radius:12px;border:none;background:var(--mcdo-green);color:#fff;cursor:pointer;font-weight:700;">Suivant — ${fmt(total)}</button>`;
  }
  if (isLast) {
    html += `<button onclick="commitWizard()" style="flex:2;padding:12px;border-radius:12px;border:none;background:var(--mcdo-yellow);cursor:pointer;font-weight:700;">Ajouter — ${fmt(total)}</button>`;
  }
  html += `</div>`;
  if (isLast) {
    html += `<div style="text-align:center;font-size:11px;color:var(--gray);margin-top:6px;">Vous pouvez ne rien ajouter</div>`;
  }
  
  body.innerHTML = html;
}

function selectWizard(key, id) {
  wizardChoices[key] = id;
  renderWizard();
}

function toggleExtra(id) {
  if (wizardChoices[id]) delete wizardChoices[id];
  else wizardChoices[id] = true;
  renderWizard();
}

function wizardNext() {
  if (wizardIndex < wizardSteps.length - 1) {
    wizardIndex++;
    renderWizard();
  }
}

function wizardPrev() {
  if (wizardIndex > 0) {
    wizardIndex--;
    renderWizard();
  }
}

function computeWizardTotal() {
  let total = wizardMenu.price;
  wizardSteps.forEach(step => {
    if (!step.extras && wizardChoices[step.key]) {
      const opt = step.options.find(o => o.id === wizardChoices[step.key]);
      if (opt) total += opt.price || 0;
    }
    if (step.extras) {
      step.options.forEach(o => {
        if (wizardChoices[o.id]) total += o.price;
      });
    }
  });
  return total;
}

function commitWizard() {
  const menu = {id:'menu_'+Date.now(), name:wizardMenu.name+' (perso)', price:computeWizardTotal(), emoji:'🍽️'};
  addToCart(menu);
  document.getElementById('overlay').classList.remove('show');
  pulseCartBar();
}

// ==================== PANIER ====================
function addToCart(p, qty = 1) {
  const existing = cart.find(item => item.id === p.id);
  if (existing) {
    existing.qty += qty;
    existing.total = existing.qty * existing.price;
  } else {
    cart.push({...p, qty:qty, total:p.price * qty});
  }
  renderCartUI();
}

function renderCartUI() {
  const totalQty = cart.reduce((s,i) => s + i.qty, 0);
  const total = cart.reduce((s,i) => s + i.total, 0);
  
  document.getElementById('cart-badge').textContent = totalQty;
  document.getElementById('cartbar-count').textContent = totalQty;
  document.getElementById('cartbar-label').textContent = totalQty > 1 ? 'articles' : 'article';
  document.getElementById('cartbar-total').textContent = fmt(total);
  document.getElementById('cartbar').classList.toggle('show', totalQty > 0);
  
  const itemsEl = document.getElementById('drawer-items');
  if (cart.length === 0) {
    itemsEl.innerHTML = `<div class="empty-cart"><span class="big">🛒</span>Votre panier est vide</div>`;
  } else {
    itemsEl.innerHTML = cart.map(item => `
      <div class="cart-item">
        <div class="ci-emoji">${item.emoji || '🍔'}</div>
        <div class="info">
          <div class="name">${item.name}</div>
          <div class="line-bottom">
            <div class="qty-ctrl">
              <button onclick="changeQty('${item.id}',-1)">−</button>
              <span>${item.qty}</span>
              <button onclick="changeQty('${item.id}',1)">+</button>
            </div>
            <span class="item-price">${fmt(item.total)}</span>
          </div>
          <button class="remove-btn" onclick="removeItem('${item.id}')">Retirer</button>
        </div>
      </div>
    `).join('');
  }
  
  document.getElementById('sub-total').textContent = fmt(total);
  document.getElementById('grand-total').textContent = fmt(total);
  document.getElementById('drawer-checkout').disabled = cart.length === 0;
}

function changeQty(id, delta) {
  const item = cart.find(i => i.id === id);
  if (!item) return;
  item.qty += delta;
  if (item.qty <= 0) {
    cart = cart.filter(i => i.id !== id);
  } else {
    item.total = item.qty * item.price;
  }
  renderCartUI();
}

function removeItem(id) {
  cart = cart.filter(i => i.id !== id);
  renderCartUI();
}

function pulseCartBar() {
  const bar = document.getElementById('cartbar');
  bar.style.transform = 'scale(1.02)';
  setTimeout(() => bar.style.transform = 'scale(1)', 150);
}

// ==================== DRAWER ====================
function openDrawer() {
  document.getElementById('drawer').classList.add('open');
  document.getElementById('drawer-scrim').classList.add('show');
}

function closeDrawer() {
  document.getElementById('drawer').classList.remove('open');
  document.getElementById('drawer-scrim').classList.remove('show');
}

document.getElementById('cart-btn').onclick = openDrawer;
document.getElementById('cartbar').onclick = openDrawer;
document.getElementById('drawer-close').onclick = closeDrawer;
document.getElementById('drawer-continue').onclick = closeDrawer;
document.getElementById('drawer-scrim').onclick = closeDrawer;

// ==================== EXPORT JSON ====================
function exportJSON() {
  const total = cart.reduce((s,i) => s + i.total, 0);
  const num = 'CMD-' + String(100 + Math.floor(Math.random() * 900));
  
  const jsonData = {
    commande: {
      numero: num,
      date: new Date().toISOString(),
      type: orderType === 'sur_place' ? 'Sur place' : 'À emporter',
      total: total,
      articles: cart.map(i => ({
        nom: i.name,
        quantite: i.qty,
        prix_unitaire: i.price,
        total: i.total
      }))
    }
  };
  
  // Télécharger le fichier JSON
  const blob = new Blob([JSON.stringify(jsonData, null, 2)], {type: 'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'commande.json';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  
  return jsonData;
}

// ==================== VALIDATION COMMANDE ====================
document.getElementById('drawer-checkout').onclick = () => {
  if (cart.length === 0) return;
  
  // Exporter le JSON
  const jsonData = exportJSON();
  
  // Afficher le ticket
  const total = cart.reduce((s,i) => s + i.total, 0);
  document.getElementById('receipt').innerHTML = `
    <div class="r-title">🍔 McBORNE</div>
    <div class="r-num">${jsonData.commande.numero}</div>
    ${cart.map(i => `
      <div class="r-line"><span>${i.qty}× ${i.name}</span><span>${fmt(i.total)}</span></div>
    `).join('')}
    <div class="r-total"><span>Total</span><span>${fmt(total)}</span></div>
    <div class="r-type">${orderType === 'sur_place' ? '🍽️ Sur place' : '🥡 À emporter'}</div>
  `;
  
  document.getElementById('json-status').textContent = '📄 Fichier commande.json téléchargé';
  
  closeDrawer();
  document.getElementById('screen-confirm').classList.add('show');
};

// ==================== NOUVELLE COMMANDE ====================
document.getElementById('confirm-new-btn').onclick = () => {
  cart = [];
  renderCartUI();
  document.getElementById('screen-confirm').classList.remove('show');
  document.getElementById('screen-welcome').style.display = 'flex';
};

// ==================== WELCOME ====================
document.querySelectorAll('.choice-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    orderType = btn.dataset.type;
    document.getElementById('order-type-btn').textContent = orderType === 'sur_place' ? '🍽️ Sur place' : '🥡 À emporter';
    document.getElementById('screen-welcome').style.display = 'none';
  });
});

document.getElementById('order-type-btn').addEventListener('click', () => {
  orderType = orderType === 'sur_place' ? 'emporter' : 'sur_place';
  document.getElementById('order-type-btn').textContent = orderType === 'sur_place' ? '🍽️ Sur place' : '🥡 À emporter';
});

// ==================== MODAL ====================
document.getElementById('modal-close').onclick = () => {
  document.getElementById('overlay').classList.remove('show');
};
document.getElementById('overlay').onclick = (e) => {
  if (e.target === e.currentTarget) document.getElementById('overlay').classList.remove('show');
};

// ==================== UTILS ====================
function fmt(n) {
  return n.toLocaleString('fr-FR', {minimumFractionDigits:2, maximumFractionDigits:2}) + ' €';
}

// ==================== INIT ====================
renderCategories();
renderCatalog();
renderCartUI();
</script>
